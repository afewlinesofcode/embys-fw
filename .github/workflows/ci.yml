name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  simulator:
    name: Simulator
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Configure HTTPS for Git submodules
        run: |
          git config --global url."https://github.com/".insteadOf "git@github.com:"

      - name: Checkout submodules
        run: |
          git submodule update --init --recursive

      - name: Build Docker image
        run: |
          docker build -t embys-fw-dev:latest .

      - name: Build libraries for simulation
        run: |
          make TC=sim

      - name: Run tests
        run: |
          make test

      - name: Build examples for simulation
        run: |
          make examples TC=sim

  arm:
    name: ARM (${{ matrix.mcu }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        mcu:
          - stm32f103xb
          - stm32f407xx
          - stm32f411xe

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Configure HTTPS for Git submodules
        run: |
          git config --global url."https://github.com/".insteadOf "git@github.com:"

      - name: Checkout submodules
        run: |
          git submodule update --init --recursive

      - name: Build Docker image
        run: |
          docker build -t embys-fw-dev:latest .

      - name: Build libraries
        run: |
          make TC=arm MCU=${{ matrix.mcu }}

      - name: Build examples
        run: |
          make examples TC=arm MCU=${{ matrix.mcu }}

      - name: Check firmware runtime policy
        run: |
          make firmware-check TC=arm MCU=${{ matrix.mcu }}
